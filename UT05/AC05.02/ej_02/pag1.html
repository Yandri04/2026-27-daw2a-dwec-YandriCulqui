<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ej02</title>
  </head>
  <body>
    <fieldset>
      <legend>Validaciones</legend>
      <form action="" id="miFormulario" name="formulario" novalidate>
        <label for="correo">Ingrese su correo</label>
        <br />
        <input
          type="email"
          id="correo"
          required
          placeholder="prueba@gmail.com"
        />
        <div id="error-email" class="mensaje"></div>
        <br />
        <br />
        <label for="telefono">Ingrese su telefono</label>
        <br />
        <input
          type="tel"
          id="telefono"
          pattern="[0-9]{9}"
          required
          placeholder="645555555"
        />
        <div id="error-tlf" class="mensaje"></div>

        <br />
        <br />
        <label for="dni">DNI:</label>
        <br />
        <input
          type="text"
          id="dni"
          pattern="[0-9]{8}[A-Z]{1}"
          required
          placeholder="12345678Z"
        />
        <div id="error-dni" class="mensaje"></div>

        <br />
        <br />
        <label for="cp">Codigo Postal:</label>
        <br />
        <input
          type="text"
          id="cp"
          pattern="[0-9]{5}"
          required
          placeholder="3150"
        />
        <div id="error-cp" class="mensaje"></div>

        <br />
        <br />
        <label for="fecha">Fecha:</label>
        <br />
        <input type="date" id="fecha" required />
        <div id="error-fecha" class="mensaje"></div>
        <br />
        <br />
        <input
          type="checkbox"
          name="terminoYCondiciones"
          id="terminoYCondiciones"
          disabled
          required
        />
        <label for="terminoYCondiciones"
          >Aceptas los Terminos y Condiciones</label
        >
        <div id="error-tyc" class="mensaje"></div>

        <br />
        <br />
        <button type="submit" id="enviar">Enviar</button>
        <p id="resultado"></p>
      </form>
    </fieldset>
  </body>
  <script src="script.js"></script>
</html>

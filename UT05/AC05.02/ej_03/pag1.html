<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ej_03</title>
  </head>
  <body>
    <fieldset>
      <legend>EJ3</legend>
      <form action="" id="miFormulario" novalidate>
        <label for="iban">Número de cuenta (IBAN)</label>
        <input
          type="text"
          id="iban"
          name="iban"
          inputmode="text"
          placeholder="ES00 0000 0000 0000 0000 0000"
          required
        />
        <div id="error-iban" class="mensaje"></div>
        <br />
        <br />
        <label for="cif">Ingrese su cif</label>
        <br />
        <input type="text" id="cif" required placeholder="Ej. B12345678" />
        <div id="error-cif" class="mensaje"></div>
        <br />
        <br />
        <label for="transferencia"
          >Ingrese al destinatario de la transferencia</label
        >
        <br />
        <input type="text" id="transferencia" required minlength="6" />
        <div id="error-transferencia" class="mensaje"></div>
        <br />
        <br />
        <label for="descripción" id="label-descripción" hidden
          >Ingrese la descripción de la transferencia</label
        >
        <div id="error-descripción" class="mensaje"></div>
        <br />
        <input type="text" id="descripción" required hidden />
        <br />
        <br />
        <button type="submit" id="enviar">Enviar</button>
        <br />
        <br />
        <p id="resultado"></p>
      </form>
    </fieldset>
    <script src="script.js"></script>
  </body>
</html>

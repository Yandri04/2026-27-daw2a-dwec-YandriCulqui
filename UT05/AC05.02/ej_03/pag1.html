<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ej_03</title>
  </head>
  <body>
    <fieldset>
      <legend>EJ3</legend>
      <form action="" id="miFormulario" novalidate>
        <label for="iban">Número de cuenta (IBAN)</label>
        <input
          type="text"
          id="iban"
          name="iban"
          inputmode="text"
          maxlength="29"
          pattern="[A-Za-z]{2}[0-9]{2}[ ]?([A-Za-z0-9]{4}[ ]?){4}[A-Za-z0-9]{2}"
          placeholder="ES00 0000 0000 0000 0000 0000"
          required
        />
        <br />
        <br />
        <label for="cif">Ingrese su cif</label>
        <br />
        <input 
        type="text" 
        id="cif" 
        required 
        placeholder="Ej. B12345678" 
        pattern=""/>
        <br />
        <br />
        <label for="transferencia"
          >Ingrese al destinatario de la transferencia</label
        >
        <br />
        <input type="text" id="transferencia" required />
        <br />
        <br />
        <label for="descripción" hidden
          >Ingrese la descripción de la transferencia</label
        >
        <br />
        <input type="text" id="descripción" required hidden />
        <br />
        <br />
        <button type="submit" id="enviar">Enviar</button>
      </form>
    </fieldset>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <form action="pagina.php" method="post" enctype="multipart/form-data">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" maxlength="30" required />
      <br /><br />

      <label for="ape">Apellidos:</label>
      <input type="text" id="ape" name="ape" maxlength="80" required />
      <br /><br />

      <label for="fechaNacimiento">Fecha Nacimiento:</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required />
      <br /><br />

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="numeroTelefonico" required />
      <br /><br />

      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="18" max="100" required />
      <br /><br />

      <label for="dni">DNI:</label>
      <input type="text" id="dni" name="dni" maxlength="9" required />
      <br /><br />

      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required />
      <br /><br />

      <span>Sexo:</span>
      <br />
      <input
        type="radio"
        id="hombre"
        name="sexo"
        value="hombre"
        checked
        required
      />
      <label for="hombre">Hombre</label>
      <br />
      <input type="radio" id="mujer" name="sexo" value="mujer" />
      <label for="mujer">Mujer</label>
      <br /><br />

      <label for="foto">Incluir foto:</label>
      <input type="file" id="foto" name="foto" />
      <br /><br />

      <input type="checkbox" id="publ" name="publ" checked required />
      <label for="publ">Publicidad</label>
      <br /><br />

      <input type="submit" value="Guardar cambios" />
      <input type="reset" value="Borrar datos" />
      <br />
    </form>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <title>Nueva ventana</title>
  </head>
  <body>
    <form id="formulario2">
      <input
        type="text"
        size="100"
        id="datos"
        value="Escribe lo que quieras pasar a la ventana principal"
      />
    </form>

    <input type="button" value="Pasar el valor" onClick="pasaDatos()" />
    <script>
      //Este código estaría en un archivo .js separado incluido con async
      function pasaDatos() {
        window.opener.document.getElementById("resultado").value =
          window.document.getElementById("datos").value;
      }
    </script>
  </body>
</html>

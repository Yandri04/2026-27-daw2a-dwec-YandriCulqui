<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ej3</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend>ACT3</legend>
        <label for="citys">Seleccione una Ciudad</label>
        <select name="citys" id="citys">
          <option value="pamplona">Ciudad 1</option>
          <option value="barcelona">Ciudad 2</option>
          <option value="valencia">Ciudad 3</option>
          <option value="sevilla">Ciudad 4</option>
        </select>
        <br />
        <br />
        <button onclick="setearCampoVacio(event)">Enviar</button>
        <br />
        <br />
        <label for="campo">Donde se pondra la ciudad</label>
        <input type="text" id="campo" name="campo" />
      </fieldset>
    </form>

    <script>
      function setearCampoVacio(event) {
        event.preventDefault();
        let ciudad = document.getElementById("citys").value;
        document.getElementById("campo").value = ciudad;
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ej3</title>
    <h1>Cmabiar imganes</h1>
    <p>Pulsa el boton para alternar entre las dos imagenes</p>
    <img src="bombilla_off.gif" alt="apagado" id="bombilla" />
    <button id="interruptor" class="interruptor">Interruptor</button>
    <script>
      const boton = document.getElementById("interruptor");
      boton.addEventListener("click", (event) => {
        imagen = document.getElementById("bombilla");
        if (imagen.src.includes("bombilla_off.gif")) {
          imagen.src = "bombilla_on.gif";
          imagen.alt = "encendido";
        } else {
          imagen.src = "bombilla_off.gif";
          imagen.alt = "apagado";
        }
      });
    </script>
  </head>
  <body></body>
</html>

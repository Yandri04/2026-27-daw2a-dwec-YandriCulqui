<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function practica() {
            let maxValue = Number.MAX_VALUE;
            let minValue = Number.MIN_VALUE;
            alert("Max Value: " + maxValue);
            alert("Min Value: " + minValue);
            // Se utiliza para mostrarnos que conceptualmente numero exageradamentes grandes como por el ejemplo el MAX_VALUE se intepretan como infinito a la maquina ya no poder interpretarlo
            alert("Valor especial: " + (maxValue * 2));
        }
    </script>
    <script> practica()</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script> 
        let val1 = parseInt(prompt("Dime un numero entero: ")) ;
        let val2 = parseInt(prompt("Dime un segundo numero entero: ")) ;

        if(val1 > val2){
            alert(`El numero 1 "${val1}" es mayor que el numero dos "${val2}"`);
        }else if(val1 < val2){
            alert(`El numero 1 "${val1}" es menor que el numero dos "${val2}"`);
        }else if(val1 === val2){
            alert(`El numero 1 "${val1}" es igual que el numero 2 "${val2}"`);
        }
            
    


    </script>
    
</body>
</html>

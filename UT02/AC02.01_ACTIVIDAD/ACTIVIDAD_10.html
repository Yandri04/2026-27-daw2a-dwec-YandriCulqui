<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACT_10</title>
</head>
<body>
    <script>
         let val1 = parseInt(prompt("Dime una numero: ") );
        
    
        while(val1 === null || val1 <= 0  ){
            val1 = prompt("Vuelve a decirme un  numero: ") ;
        }

        function mitadTriangulo(num) {
            let triangulo = "";
            for (let i = 0; i <= num; i++) {
                for (let f = 0; f <= i; f++) {
                     triangulo += "*"
                }
                triangulo += "\n"
            }
            console.log(triangulo);
        
        }
       mitadTriangulo(val1);

    </script>
</body>
</html>
